name: tourism

services:
  # ---------------------------------------------------------------------------
  # MySQL Database Service
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tourism-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: tourism_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - tourism-mysql-data:/var/lib/mysql
    networks:
      - tourism-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Laravel Backend (PHP-FPM 8.3)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../tourism-backend-api
      dockerfile: Dockerfile
    container_name: tourism-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_NAME=AngkorVerses
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5175
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=tourism_db
      - DB_USERNAME=root
      - DB_PASSWORD=
      - AI_CHAT_API_URL=http://aichatbot:8001
    volumes:
      - ../tourism-backend-api:/var/www
    networks:
      - tourism-network

  # ---------------------------------------------------------------------------
  # Nginx Web Server for Backend API (Port 8000)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: tourism-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../tourism-backend-api:/var/www:ro
      - ../tourism-backend-api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - tourism-network

  # ---------------------------------------------------------------------------
  # Admin Panel Frontend (React 19 + Vite - Port 5174)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ../tourism-admin
      dockerfile: Dockerfile
    container_name: tourism-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ../tourism-admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - tourism-network
    depends_on:
      - nginx

  # ---------------------------------------------------------------------------
  # Tourist Web Frontend (React 19 + Vite - Port 5175)
  # ---------------------------------------------------------------------------
  travel:
    build:
      context: ../tourism-travel
      dockerfile: Dockerfile
    container_name: tourism-travel
    restart: unless-stopped
    ports:
      - "5175:5175"
    volumes:
      - ../tourism-travel:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/travel
      - VITE_AI_CHAT_URL=http://localhost:8001
      - VITE_GOOGLE_CLIENT_ID=992178086409-a9j45bl7piu53vlfbihe1c9sgpv0itsb.apps.googleusercontent.com
    networks:
      - tourism-network
    depends_on:
      - nginx
      - aichatbot

  # ---------------------------------------------------------------------------
  # AI Tourism Chatbot Microservice (FastAPI + RAG - Port 8001)
  # ---------------------------------------------------------------------------
  aichatbot:
    build:
      context: ../aichatbot
      dockerfile: Dockerfile
    container_name: tourism-aichatbot
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ../aichatbot:/app
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=True
    networks:
      - tourism-network

# -----------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# -----------------------------------------------------------------------------
volumes:
  tourism-mysql-data:
    name: tourism-mysql-data

networks:
  tourism-network:
    name: tourism-network
    driver: bridge
